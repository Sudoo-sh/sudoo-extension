# Checks run on every commit. Install once: npm ci && pre-commit install
default_install_hook_types: [pre-commit]
# Licences, tool folders, fixtures and lock files stay as they are.
exclude: |
  (?x)^(
    LICENSE\.md|
    \.claude/.*|
    .*fixture.*\.json|
    tests/fixtures/.*|
    .*__fixtures__/.*|
    package-lock\.json
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: biome
        name: biome (format and lint)
        entry: npx biome check --write --no-errors-on-unmatched
        language: system
        types_or: [ts, javascript, json]
      - id: typecheck
        name: tsc (types)
        entry: npx tsc --noEmit
        language: system
        types_or: [ts]
        pass_filenames: false
